services:
  postgres:
    image: pgvector/pgvector:0.8.6-pg16
    restart: unless-stopped
    env_file:
      - ./.env
    volumes:
      - /srv/homelab/postgres/data:/var/lib/postgresql/data
    networks:
      - homelab-backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

networks:
  homelab-backend:
    external: true
