services:
  mealie:
    image: ghcr.io/mealie-recipes/mealie:latest  # Specifies the Mealie Docker image and version.
    container_name: mealie                       # Names the container for easier management.
    restart: always                              # Ensures the container restarts automatically unless stopped.
    ports:
      - 127.0.0.1:9925:9000                              # Maps port 9925 on the host to port 9000 in the container.
    deploy:
      resources:
        limits:
          memory: 1000M                          # Limits the container to use a maximum of 1000M of memory.
    volumes:
      - /srv/homelab/mealie/data:/app/data/
    environment:
      - ALLOW_SIGNUP=false                       # Allows new user signups on the Mealie instance.
      - OIDC_AUTH_ENABLED=true
      - PUID=1000                                # Sets the user ID for the container.
      - PGID=1000                                # Sets the group ID for the container.
      - TZ=America/Sao_Paulo                     # Sets the timezone for the container.
      - MAX_WORKERS=1                            # Limits the number of workers to 1.
      - WEB_CONCURRENCY=1                        # Sets the concurrency level for web workers.
      - BASE_URL=https://receitas.rotiav.com.br  # The base URL where Mealie is accessed.

